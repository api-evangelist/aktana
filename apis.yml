aid: aktana
name: Aktana (PharmaForceIQ)
description: 'Aktana is an AI-driven commercial engagement platform for the pharmaceutical
  and life-sciences industry, now operating as PharmaForceIQ (aktana.com redirects
  in full to pharmaforceiq.com). The platform provides real-time orchestration that
  coordinates digital and field marketing across channels ("optichannel") to drive
  measurable script lift and HCP (healthcare provider) adoption, with NPI-level dashboards
  tying engagement to outcomes for HCP marketing, DTC marketing, medical affairs, omnichannel,
  sales, and commercial-leadership teams. The company was surfaced as a portfolio company
  of Norwest Venture Partners. It publishes no public developer/API surface; this profile
  captures corporate identity, compliance posture (SOC 2 Type II, ISO 27001, HIPAA,
  CCPA, GDPR), and web properties.'
